<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
    <defs><filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#18181b" flood-opacity="0.10"/></filter></defs>
    <style>
  .bg { fill: #fbfdfd; }
  .shell { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
  .panel { fill: #ffffff; stroke: #e4e4e7; stroke-width: 1; }
  .wash { fill: #f6faf9; stroke: #dfe9e6; stroke-width: 1; }
  .muted { fill: #f4f4f5; stroke: #e4e4e7; stroke-width: 1; }
  .ink { fill: #18181b; }
  .body { fill: #52525b; }
  .subtle { fill: #71717a; }
  .green { fill: #16a34a; }
  .danger { fill: #b42318; }
  .warn { fill: #a15c07; }
  .soft-green { fill: #eaf7f1; }
  .mono { font-family: 'Geist Mono', SFMono-Regular, Consolas, monospace; }
  text { font-family: Geist, Arial, sans-serif; dominant-baseline: auto; }
  .display { font-family: Commissioner, Geist, Arial, sans-serif; font-weight: 600; }
  .label { font-size: 11px; font-weight: 600; letter-spacing: 2.4px; fill: #71717a; }
  .small { font-size: 12px; fill: #71717a; }
  .copy { font-size: 15px; fill: #52525b; }
  .title { font-size: 34px; font-weight: 600; fill: #18181b; }
  .h1 { font-size: 58px; font-weight: 600; fill: #18181b; }
  .buttonText { font-size: 15px; font-weight: 600; fill: #ffffff; }
</style>
    <rect width="1440" height="960" class="bg"/>
    <rect x="34" y="34" width="1372" height="892" rx="24" class="shell"/>
    <g transform="translate(74 64)">
    <rect x="0" y="0" width="42" height="42" rx="13" fill="#18181b"/>
    <path d="M13 28h16M13 21h22M13 14h12" stroke="#fff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="56" y="18" font-size="18" font-weight="600" class="ink">ShipRepo</text>
    <text x="56" y="38" font-size="12" class="subtle">Repo to Sealos app</text>
    <text x="1044" y="24" font-size="13" class="subtle">Connected to GitHub</text>
    <rect x="1178" y="1" width="112" height="38" rx="19" class="muted"/>
    <text x="1206" y="25" font-size="13" font-weight="600" class="ink">Settings</text>
  </g>
    <g transform="translate(118 170)">
      <text x="0" y="24" class="label">SEALOS DEPLOY COMMAND</text>
      <text x="0" y="105" class="display" font-size="58" font-weight="600">Choose a repo.</text>
      <text x="0" y="170" class="display" font-size="58" font-weight="600">Get a preview.</text>
      <text x="0" y="228" font-size="18" class="body">ShipRepo inspects a GitHub repository, prepares the fixed</text>
      <text x="0" y="256" font-size="18" class="body">/sealos-deploy path, and returns a preview before production changes.</text>
      <g transform="translate(0 332)"><line x1="13" y1="22" x2="13" y2="214" stroke="#d4d4d8"/><g transform="translate(0 0)"><circle cx="13" cy="22" r="7" fill="#16a34a" stroke="#16a34a"/><text x="36" y="18" font-size="14" font-weight="600" class="ink">Select repository</text><text x="36" y="39" class="small">Pick owner, repo, and branch</text></g><g transform="translate(0 64)"><circle cx="13" cy="22" r="7" fill="#f4f4f5" stroke="#d4d4d8"/><text x="36" y="18" font-size="14" font-weight="600" class="ink">Analyze deploy shape</text><text x="36" y="39" class="small">Detect framework, commands, env</text></g><g transform="translate(0 128)"><circle cx="13" cy="22" r="7" fill="#f4f4f5" stroke="#d4d4d8"/><text x="36" y="18" font-size="14" font-weight="600" class="ink">Create preview</text><text x="36" y="39" class="small">Open a Sealos runtime URL</text></g><g transform="translate(0 192)"><circle cx="13" cy="22" r="7" fill="#f4f4f5" stroke="#d4d4d8"/><text x="36" y="18" font-size="14" font-weight="600" class="ink">Publish after review</text><text x="36" y="39" class="small">Confirm files and production target</text></g></g>
    </g>
    <g transform="translate(720 178)" filter="url(#shadow)">
      <rect width="590" height="484" rx="28" class="panel"/>
      <g transform="translate(34 34)">
        <text class="label" x="0" y="14">REPOSITORY</text><rect x="0" y="34" width="288" height="44" rx="22" fill="#f4f4f5" stroke="#e4e4e7"/><text x="18" y="62" font-size="14" fill="#18181b" class="mono">jingyang / web-shop</text><rect x="306" y="34" width="100" height="44" rx="22" fill="#fff" stroke="#e4e4e7"/><text x="324" y="62" font-size="14" fill="#18181b" class="mono">main</text>
        <line x1="0" y1="110" x2="522" y2="110" stroke="#e4e4e7"/>
        <text x="0" y="154" font-size="28" font-weight="500" class="ink">Prepare this repository for Sealos.</text>
        <text x="0" y="190" font-size="16" class="subtle">Analyze deploy blockers, add required files, and create a preview URL.</text>
        <rect x="0" y="230" width="522" height="78" rx="18" fill="#fafafa" stroke="#e4e4e7"/>
        <text x="22" y="262" font-size="15" class="subtle">Optional deployment intent</text>
        <text x="22" y="288" font-size="15" class="ink">Create a public preview without changing production.</text>
        <rect x="0" y="342" width="182" height="48" rx="24" class="green"/><text x="44" y="372" class="buttonText">Start analysis</text>
        <text x="202" y="371" font-size="13" class="subtle">Runs the fixed /sealos-deploy task</text>
      </g>
    </g>
    <g transform="translate(720 710)"><rect width="590" height="108" rx="18" class="wash"/><text x="28" y="34" font-size="13" font-weight="600" class="ink">What ShipRepo returns</text><text x="28" y="65" font-size="14" class="body">A clear preview result and one next action.</text><rect x="402" y="31" width="142" height="44" rx="22" fill="#fff" stroke="#dbe7e3"/><text x="430" y="58" font-size="13" font-weight="600" fill="#16a34a">Preview ready</text></g>
  </svg>
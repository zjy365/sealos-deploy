<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="960" viewBox="0 0 1440 960">
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbfdfd"/>
      <stop offset="1" stop-color="#f2f7f6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="26" stdDeviation="32" flood-color="#18181b" flood-opacity="0.10"/>
    </filter>
  </defs>
  <rect width="1440" height="960" fill="url(#canvas)"/>
  <rect x="34" y="30" width="1372" height="900" rx="24" fill="#ffffff" stroke="#e4e4e7"/>
  <g transform="translate(74 64)">
    <rect x="0" y="0" width="42" height="42" rx="13" fill="#18181b"/>
    <path d="M13 28h16M13 21h22M13 14h12" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
    <text x="56" y="18" font-family="Commissioner, Geist, Arial" font-size="18" font-weight="600" fill="#18181b">ShipRepo</text>
    <text x="56" y="38" font-family="Geist, Arial" font-size="12" fill="#71717a">Repo to Sealos app</text>
    <text x="1045" y="24" font-family="Geist, Arial" font-size="13" fill="#71717a">Connected to GitHub</text>
    <rect x="1178" y="1" width="112" height="38" rx="19" fill="#f4f4f5" stroke="#e4e4e7"/>
    <text x="1206" y="25" font-family="Geist, Arial" font-size="13" font-weight="600" fill="#18181b">Settings</text>
  </g>
  <g transform="translate(118 170)">
    <text x="0" y="24" font-family="Geist, Arial" font-size="12" font-weight="600" letter-spacing="2.8" fill="#71717a">SEALOS DEPLOY COMMAND</text>
    <text x="0" y="105" font-family="Commissioner, Geist, Arial" font-size="58" font-weight="600" fill="#18181b">Choose a repo.</text>
    <text x="0" y="170" font-family="Commissioner, Geist, Arial" font-size="58" font-weight="600" fill="#18181b">Get a preview.</text>
    <text x="0" y="228" font-family="Geist, Arial" font-size="18" fill="#52525b">ShipRepo inspects a GitHub repository, prepares the fixed</text>
    <text x="0" y="256" font-family="Geist, Arial" font-size="18" fill="#52525b">/sealos-deploy path, and returns a preview before production changes.</text>
    <g transform="translate(0 332)">
      <line x1="13" y1="22" x2="13" y2="214" stroke="#d4d4d8" stroke-width="1"/>
      
      <g transform="translate(0 0)">
        <circle cx="13" cy="22" r="7" fill="#16a34a" stroke="#16a34a"/>
        <text x="36" y="18" font-family="Geist, Arial" font-size="14" font-weight="600" fill="#18181b">Select repository</text>
        <text x="36" y="39" font-family="Geist, Arial" font-size="12" fill="#71717a">Pick owner, repo, and branch</text>
      </g>
      <g transform="translate(0 64)">
        <circle cx="13" cy="22" r="7" fill="#f4f4f5" stroke="#d4d4d8"/>
        <text x="36" y="18" font-family="Geist, Arial" font-size="14" font-weight="600" fill="#18181b">Analyze deploy shape</text>
        <text x="36" y="39" font-family="Geist, Arial" font-size="12" fill="#71717a">Detect framework, commands, env</text>
      </g>
      <g transform="translate(0 128)">
        <circle cx="13" cy="22" r="7" fill="#f4f4f5" stroke="#d4d4d8"/>
        <text x="36" y="18" font-family="Geist, Arial" font-size="14" font-weight="600" fill="#18181b">Create preview</text>
        <text x="36" y="39" font-family="Geist, Arial" font-size="12" fill="#71717a">Open a Sealos runtime URL</text>
      </g>
      <g transform="translate(0 192)">
        <circle cx="13" cy="22" r="7" fill="#f4f4f5" stroke="#d4d4d8"/>
        <text x="36" y="18" font-family="Geist, Arial" font-size="14" font-weight="600" fill="#18181b">Publish after review</text>
        <text x="36" y="39" font-family="Geist, Arial" font-size="12" fill="#71717a">Confirm files and production target</text>
      </g>
    </g>
  </g>
  <g transform="translate(720 178)" filter="url(#shadow)">
    <rect x="0" y="0" width="590" height="484" rx="28" fill="#ffffff" stroke="#e4e4e7"/>
    <g transform="translate(34 34)">
      <text x="0" y="14" font-family="Geist, Arial" font-size="11" font-weight="600" letter-spacing="2.4" fill="#71717a">REPOSITORY</text>
      <rect x="0" y="34" width="288" height="44" rx="22" fill="#f4f4f5" stroke="#e4e4e7"/>
      <text x="18" y="62" font-family="Geist Mono, monospace" font-size="14" fill="#18181b">jingyang / web-shop</text>
      <rect x="306" y="34" width="100" height="44" rx="22" fill="#ffffff" stroke="#e4e4e7"/>
      <text x="330" y="62" font-family="Geist Mono, monospace" font-size="13" fill="#3f3f46">main</text>
      <line x1="0" y1="110" x2="522" y2="110" stroke="#e4e4e7"/>
      <text x="0" y="154" font-family="Geist, Arial" font-size="28" font-weight="500" fill="#18181b">Prepare this repository for Sealos.</text>
      <text x="0" y="190" font-family="Geist, Arial" font-size="16" fill="#71717a">Analyze deploy blockers, add required files, and create a preview URL.</text>
      <rect x="0" y="230" width="522" height="78" rx="18" fill="#fafafa" stroke="#e4e4e7"/>
      <text x="22" y="262" font-family="Geist, Arial" font-size="15" fill="#71717a">Optional deployment intent</text>
      <text x="22" y="288" font-family="Geist, Arial" font-size="15" fill="#18181b">Create a public preview without changing production.</text>
      <rect x="0" y="342" width="182" height="48" rx="24" fill="#16a34a"/>
      <text x="44" y="372" font-family="Geist, Arial" font-size="15" font-weight="600" fill="#ffffff">Start analysis</text>
      <text x="202" y="371" font-family="Geist, Arial" font-size="13" fill="#71717a">Runs the fixed /sealos-deploy task</text>
    </g>
  </g>
  <g transform="translate(720 710)">
    <rect x="0" y="0" width="590" height="108" rx="18" fill="#f8fbfa" stroke="#dbe7e3"/>
    <text x="28" y="34" font-family="Geist, Arial" font-size="13" font-weight="600" fill="#18181b">What ShipRepo returns</text>
    <text x="28" y="65" font-family="Geist, Arial" font-size="14" fill="#52525b">A clear preview result, changed deployment files, and one next action.</text>
    <rect x="402" y="31" width="142" height="44" rx="22" fill="#ffffff" stroke="#dbe7e3"/>
    <text x="430" y="58" font-family="Geist, Arial" font-size="13" font-weight="600" fill="#16a34a">Preview ready</text>
  </g>
</svg>